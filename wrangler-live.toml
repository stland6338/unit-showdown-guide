# ライブ検知 Worker の設定
# デプロイ:    npx wrangler deploy -c wrangler-live.toml
# APIキー設定: npx wrangler secret put YOUTUBE_API_KEY -c wrangler-live.toml
name = "showdown-live"
main = "cloudflare/live-worker.js"
compatibility_date = "2026-07-01"

[triggers]
# 2026-08-18 サイト閉鎖に伴いライブ検知 cron を停止（再開するときは ["*/5 * * * *"] に戻す）
crons = []

[vars]
# 2026-08-18 サイト閉鎖: "1" の間は scheduled() が何もしない（cron 削除の伝播遅延対策）。復元時は削除
SITE_CLOSED = "1"

[[kv_namespaces]]
binding = "LIVE_KV"
# Cloudflare KV namespace: SHOWDOWN_LIVE_KV
id = "9dd8f4c052334ccebbb5993d21ac7fd5"
