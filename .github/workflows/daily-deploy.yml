# push 時に検証・ビルド・Cloudflare Pages デプロイを行う。
# 2026-08-18 サイト閉鎖に伴い毎朝 6:00 JST の定時再ビルド（schedule: cron "0 21 * * *"）は停止。
# 必要な secrets: CLOUDFLARE_API_TOKEN（Pages:Edit）, CLOUDFLARE_ACCOUNT_ID
name: daily-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate data
        run: npm run check:data

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_LIVE_API_URL: ${{ vars.NEXT_PUBLIC_LIVE_API_URL }}

      - name: Check deployment credentials
        id: deploy-credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment credentials are not configured; validation and build completed, deployment skipped."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.deploy-credentials.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name unit-showdown-guide --branch main
